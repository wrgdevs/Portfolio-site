<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wei Rong Gao's software development portfolio featuring game development, graphics, simulation, data, and finance projects.">
    <title>Wei Rong | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="assets/images/backgroundw.webp?v=20260618a">
    <link rel="stylesheet" href="styles.css?v=20260618a">
    <link rel="stylesheet" href="projects.css?v=20260618a">
    <link rel="stylesheet" href="effects.css?v=20260618a">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="portfolio-data.js?v=20260618a" defer></script>
    <script src="script.js?v=20260618a" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <div class="header-copy">
                <h1 id="typed-header" class="typewriter typing">WELCOME TO MY PORTFOLIO</h1>
                <p id="typed-subheader">WEI RONG GAO</p>
            </div>
            <div class="header-actions">
                <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false">AUDIO OFF</button>
                <button class="header-github-button" type="button" onclick="openGithubModal()" aria-haspopup="dialog">GitHub</button>
            </div>
        </div>
    </header>

    <main>
        <nav class="map" aria-label="Portfolio sections">
            <button class="level" type="button" onclick="jumpToSection('about')">ABOUT ME</button>
            <button class="level" type="button" onclick="jumpToSection('current')">CURRENTLY WORKING ON</button>
            <button class="level" type="button" onclick="jumpToSection('projects')">PROJECTS</button>
            <button class="level" type="button" onclick="jumpToSection('contact')">CONTACT</button>
        </nav>
    </main>

    <div class="github-modal" id="github-modal" role="dialog" aria-modal="true" aria-labelledby="github-modal-title" aria-hidden="true">
        <div class="github-modal-card">
            <button class="github-modal-close" type="button" onclick="closeGithubModal()" aria-label="Close GitHub popup">x</button>
            <p class="github-modal-label">GitHub Profile</p>
            <h2 id="github-modal-title">Wei Rong Gao</h2>
            <p class="github-modal-handle">@wrgdevs</p>
            <p class="github-modal-text">View my repositories, project source code, and current development work.</p>
            <a class="github-modal-link" href="https://github.com/wrgdevs" target="_blank" rel="noopener noreferrer">Open GitHub Profile</a>
        </div>
    </div>


    <nav class="section-radar" aria-label="Section radar">
        <button type="button" data-section="about" aria-label="Jump to About"></button>
        <button type="button" data-section="current" aria-label="Jump to Current Work"></button>
        <button type="button" data-section="projects" aria-label="Jump to Projects"></button>
        <button type="button" data-section="contact" aria-label="Jump to Contact"></button>
    </nav>

    <div class="progress-circle" aria-hidden="true">
        <svg class="progress-ring" width="60" height="60">
            <circle class="progress-ring__circle" stroke-width="4" fill="transparent" r="28" cx="30" cy="30" />
        </svg>
    </div>
</body>
</html>
